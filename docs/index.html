<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEA Live Meteorological Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 p-4 min-h-screen">
  <div class="max-w-md mx-auto space-y-4">
    
    <!-- Header -->
    <div class="flex items-center justify-between pb-2 border-b border-slate-200">
      <div>
        <h1 class="text-xl font-bold text-slate-900">SG Environment Live</h1>
        <p class="text-xs text-slate-500">Real-time data from data.gov.sg (NEA)</p>
      </div>
      <button onclick="fetchData()" class="p-2 bg-blue-50 text-blue-600 rounded-full hover:bg-blue-100 transition active:scale-95">
        🔄
      </button>
    </div>

    <!-- PSI Card -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Air Quality (24h PSI)</span>
        <span id="psi-badge" class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-gray-100 text-gray-600">Loading...</span>
      </div>
      <div class="flex items-baseline space-x-2">
        <span id="psi-val" class="text-5xl font-extrabold text-slate-900">--</span>
        <span class="text-sm font-medium text-slate-400">PSI</span>
      </div>
      <div class="pt-2 border-t border-slate-50 flex justify-between text-xs text-slate-500">
        <span>PM2.5 (National): <strong id="pm25-val" class="text-slate-700">--</strong></span>
        <span id="psi-updated">--</span>
      </div>
    </div>

    <!-- Weather Forecast Card -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-3">
      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">24-Hour Forecast</span>
      <div class="flex items-center space-x-3">
        <span class="text-3xl">🌤️</span>
        <div>
          <p id="weather-forecast" class="text-base font-bold text-slate-900">Loading forecast...</p>
          <p class="text-xs text-slate-500">Singapore Islandwide</p>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3 pt-2">
        <div class="bg-slate-50 p-3 rounded-xl">
          <span class="text-xs text-slate-400 block mb-1">Temperature</span>
          <span id="temp-val" class="text-lg font-bold text-slate-800">--</span>
        </div>
        <div class="bg-slate-50 p-3 rounded-xl">
          <span class="text-xs text-slate-400 block mb-1">Humidity</span>
          <span id="humidity-val" class="text-lg font-bold text-slate-800">--</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    async function fetchData() {
      try {
        // Fetch PSI
        const psiRes = await fetch("https://api-open.data.gov.sg/v2/real-time/api/psi");
        const psiData = await psiRes.json();
        const latestPsi = psiData.data.readings[0];
        const pm25 = latestPsi.pm25_twenty_four_hourly.national;
        const psi = latestPsi.psi_twenty_four_hourly.national;

        document.getElementById('psi-val').textContent = psi;
        document.getElementById('pm25-val').textContent = pm25 + " µg/m³";

        const badge = document.getElementById('psi-badge');
        if (psi <= 50) {
          badge.textContent = "Good";
          badge.className = "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-700";
        } else if (psi <= 100) {
          badge.textContent = "Moderate";
          badge.className = "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-700";
        } else {
          badge.textContent = "Unhealthy";
          badge.className = "px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-100 text-rose-700";
        }

        // Fetch Weather
        const weatherRes = await fetch("https://api-open.data.gov.sg/v2/real-time/api/twenty-four-hr-forecast");
        const weatherData = await weatherRes.json();
        const forecast = weatherData.data.records[0].general;

        document.getElementById('weather-forecast').textContent = forecast.forecast;
        document.getElementById('temp-val').textContent = `${forecast.temperature.low}° - ${forecast.temperature.high}°C`;
        document.getElementById('humidity-val').textContent = `${forecast.relative_humidity.low}% - ${forecast.relative_humidity.high}%`;

      } catch (e) {
        console.error("Fetch error:", e);
      }
    }

    fetchData();
  </script>
</body>
</html>
